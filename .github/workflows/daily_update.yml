name: WNBA Daily Scraper

on:
  schedule:
    - cron: "0 12 * * *" # Runs at 12:00 PM UTC daily
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Run the Scraper
        run: python espn_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add wnba_data.csv

          # This checks for changes and commits with today's date!
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily WNBA data update for $(date +'%Y-%m-%d')" && git push)
